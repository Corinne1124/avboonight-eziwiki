name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'   # 自动缓存 ~/.npm，加快 npm install

      # 3. 安装依赖（如果缓存了 node_modules 则可跳过，但这里用 actions/setup-node 自带缓存）
      - name: Install dependencies
        run: npm ci

      # 4. 缓存 .next/cache 目录
      - name: Cache Next.js build
        uses: actions/cache@v4
        id: next-cache      # 为了后续步骤判断是否命中
        with:
          path: |
            .next/cache
          # 生成缓存键
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      # 5. 执行构建
      - name: Build
        run: npm run build