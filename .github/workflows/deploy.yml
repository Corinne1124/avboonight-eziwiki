name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      # Full history, not the single commit a checkout fetches by default: a
      # page with no `updated` in its frontmatter is dated from the last commit
      # that touched it, and a shallow clone has no such commit for anything
      # older than the tip. Those pages would simply carry no date.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      # GitHub Pages serves this project site from /eziwiki, so every emitted
      # path needs that prefix. Set here rather than inferred from CI, so that
      # test and lint jobs — and forks deploying elsewhere — are unaffected.
      #
      # `NEXT_PUBLIC_SITE_URL` is deliberately not set. This deployment is a
      # mirror of the production site on Vercel, so it keeps the payload's
      # `baseUrl` and canonicalises to Vercel rather than to itself: two copies
      # each claiming to be the original would compete for the same searches.
      # Only the base path differs, which is what keeps assets resolving here.
      - name: Build with Next.js
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_PATH: /eziwiki

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
